[tool.pytest.ini_options]
testpaths = ["src/backend/tests"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = [
    "F",     # Pyflakes
    "E",     # pycodestyle errors
]
ignore = ["E501"]  # line-too-long handled by formatters

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
explicit_package_bases = true
check_untyped_defs = false
disallow_untyped_defs = false
disallow_incomplete_defs = false
warn_return_any = false
warn_unused_ignores = false
warn_no_return = false
allow_untyped_globals = true
disable_error_code = ["var-annotated", "attr-defined", "union-attr", "index", "assignment", "arg-type", "misc", "call-arg", "valid-type", "dict-item", "annotation-unchecked", "return-value", "operator"]
show_error_codes = true
