name: ScholarMind CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - run: ruff check src/backend/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install mypy -r src/backend/requirements.txt
      - run: mypy src/backend/

  test:
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libcurl4-openssl-dev libmagic1
      - name: Install Python dependencies
        run: pip install -r src/backend/requirements.txt pytest pytest-asyncio pytest-cov
      - name: Run tests
        run: pytest src/backend/tests/ --cov=src/backend --cov-report=term -v
        env:
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET_KEY: ci-test-secret-key-for-scholarmind-min-32-chars
          RATE_LIMIT_ENABLED: "false"
          ENVIRONMENT: test

  security:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install bandit safety
      - run: bandit -r src/backend/ -f json -o bandit_report.json || true
      - run: safety check --full-report || true

  build:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: scholarmind:latest
