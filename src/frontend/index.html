  <!-- FOUC 预防：在 JS 执行前读取保存的主题，避免深色→浅色闪烁 -->
  <script>
    (function(){try{var th=(function(){var r=localStorage.getItem('sm_theme');if(r){try{var p=JSON.parse(r);return p||'dark';}catch(e){return r.replace(/^"|"$/g,'')||'dark';}}return 'dark';})();document.documentElement.setAttribute('data-theme',th);}catch(e){}})();
  </script>
