version: "3.9"

services:
  backend:
    build: .
    container_name: scholarmind-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - REDIS_URL=redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?required}@redis:6379/1
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-scholarmind}:${POSTGRES_PASSWORD:-scholarmind}@postgres:5432/${POSTGRES_DB:-scholarmind}
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  celery-worker:
    build: .
    container_name: scholarmind-celery
    command: celery -A src.backend.scheduler.celery_app worker -l info -Q celery,charts
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      - CELERY_RESULT_BACKEND=redis://:${REDIS_PASSWORD:?required}@redis:6379/1
    volumes:
      - ./data:/app/data
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  celery-beat:
    build: .
    container_name: scholarmind-beat
    command: celery -A src.backend.scheduler.celery_app beat -l info
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD:?required}@redis:6379/0
      - CELERY_BROKER_URL=redis://:${REDIS_PASSWORD:?required}@redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: scholarmind-postgres
    environment:
      # P1 Task 13：移除弱口令默认值，强制 .env 提供凭据（未设置则启动失败提示 required）
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:?required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scholarmind"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: scholarmind-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?required}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
